name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            ros: humble
          - os: ubuntu-24.04
            ros: jazzy
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ matrix.ros }}

      - name: Install DexHand SDK
        run: |
          set -euo pipefail
          sudo apt-get update
          if [ "${{ matrix.os }}" = "ubuntu-22.04" ]; then
            # libgoogle-glog-dev depends on libunwind-dev, which Breaks the
            # runner image's libunwind-14-dev, and libunwind7-dev does not exist.
            # Unpack the SDK and install the shared libraries the node loads.
            # Jammy ships libgsl.so.27. px_kinematics needs libgsl.so.25.
            # compat/libgsl.so.25 requires GLIBC_2.38, so use Debian bullseye's
            # build, which only needs glibc 2.31.
            sudo dpkg-deb -x docs/DexHandSDK-2.1.1-Linux-nonlopt.deb /tmp/dexhandsdk
            sudo cp -a /tmp/dexhandsdk/usr/. /usr/
            curl -fsSL -o /tmp/libgsl25.deb \
              http://deb.debian.org/debian/pool/main/g/gsl/libgsl25_2.6+dfsg-2_amd64.deb
            sudo dpkg-deb -x /tmp/libgsl25.deb /tmp/libgsl25
            sudo cp -a /tmp/libgsl25/usr/lib/x86_64-linux-gnu/libgsl.so.25 \
              /tmp/libgsl25/usr/lib/x86_64-linux-gnu/libgsl.so.25.0.0 \
              /usr/local/lib/
            sudo ldconfig
            sudo apt-get install -y \
              libopencv-dev \
              libboost-filesystem1.74.0 \
              libspdlog1 \
              libfmt8 \
              libgoogle-glog0v5 \
              libopenblas0 \
              libyaml-cpp0.7 \
              libjsoncpp25 \
              libnlopt0 \
              libgslcblas0
          else
            sudo apt-get install -y ./docs/DexHandSDK-2.1.1-Linux-nonlopt.deb
            # Bundled OpenCV 4.5 videoio still needs the 4.5 camera backends.
            # Noble's libopencv-dev is 4.6 and does not pull them. px_kinematics
            # needs libgslcblas.so.0. Bundled FFmpeg 4.4 needs libaribb24 and
            # libsmbclient, which the runner image does not ship.
            sudo apt-get install -y \
              libdc1394-25 \
              libgstreamer1.0-0 \
              libgstreamer-plugins-base1.0-0 \
              libgphoto2-6t64 \
              libgphoto2-port12t64 \
              libgslcblas0 \
              libaribb24-0t64 \
              libsmbclient0
          fi

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          # setup.bash reads unset AMENT_* variables.
          set +u
          source "/opt/ros/${{ matrix.ros }}/setup.bash"
          set -u
          sudo apt-get install -y python3-colcon-common-extensions
          colcon build --cmake-args -DPython3_EXECUTABLE=/usr/bin/python3

      - name: Load the node without connecting
        shell: bash
        run: |
          set -euo pipefail
          # setup.bash reads unset AMENT_* variables.
          set +u
          source "/opt/ros/${{ matrix.ros }}/setup.bash"
          source install/setup.bash
          set -u
          bin="$(ros2 pkg prefix dexh13_hand)/lib/dexh13_hand/hand_node"
          if ldd "$bin" | grep -q 'not found'; then
            ldd "$bin" | grep 'not found'
            exit 1
          fi
          if [ "${{ matrix.os }}" = "ubuntu-24.04" ]; then
            readelf -d "$bin" | grep -q 'ORIGIN/compat'
            ldd "$bin" | grep -q '/dexh13_hand/compat/libdexhand_control_cpp.so'
          else
            if ldd "$bin" | grep -q '/dexh13_hand/compat/'; then
              echo "Ubuntu 22.04 binary resolved libraries from compat/"
              ldd "$bin"
              exit 1
            fi
            ldd "$bin" | grep -q 'libdexhand_control_cpp.so'
          fi
          log="$(mktemp)"
          ros2 run dexh13_hand hand_node --ros-args \
            -r __node:=dexh13_ci \
            -p connect_on_start:=false >"$log" 2>&1 &
          pid=$!
          ok=0
          for _ in $(seq 1 25); do
            if grep -q 'DexH13 side=' "$log"; then
              ok=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              break
            fi
            sleep 0.4
          done
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          cat "$log"
          test "$ok" = 1
